<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Utilizador</title>

    <!-- Materialize CSS -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
    <!-- Material Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <!-- CSS específico desta página -->
    <link rel="stylesheet" href="{{ url_for('static', filename='login_usuario.css') }}">
</head>
<body>

    <div class="login-wrapper">
        <div class="card dark-card z-depth-3">

            <h2 class="titulo center-align">
                <span class="emoji">👤</span>
                Login de Utilizador
            </h2>

            <!-- Mensagem de Erro (Flask) -->
            {% if erro %}
            <div id="erro-msg" data-erro="{{ erro }}" class="mensagem-erro">
                <i class="material-icons tiny">error_outline</i>
                {{ erro }}
            </div>
            {% endif %}

            <form action="/login/usuario" method="POST" id="form-login" novalidate>

                <!-- Email -->
                <div class="input-field">
                    <i class="material-icons prefix">email</i>
                    <input type="email" id="email" name="email"
                           class="validate" required autocomplete="email">
                    <label for="email">Email</label>
                    <span class="helper-text"
                          data-error="Email inválido"
                          data-success=""></span>
                </div>

                <!-- Senha -->
                <div class="input-field">
                    <i class="material-icons prefix">lock</i>
                    <input type="password" id="senha" name="senha"
                           class="validate" required minlength="6"
                           autocomplete="current-password">
                    <label for="senha">Senha</label>
                    <span class="helper-text"
                          data-error="Mínimo 6 caracteres"
                          data-success=""></span>
                    <i class="material-icons toggle-password"
                       data-target="senha"
                       title="Mostrar / ocultar senha">visibility</i>
                </div>

                <!-- Lembrar-me -->
                <p class="lembrar">
                    <label>
                        <input type="checkbox" id="lembrar" name="lembrar" class="filled-in">
                        <span>Lembrar-me</span>
                    </label>
                </p>

                <!-- Botão -->
                <button type="submit"
                        class="btn-large waves-effect waves-light btn-login">
                    Entrar
                    <i class="material-icons right">arrow_forward</i>
                </button>

            </form>

            <div class="divider"></div>

            <p class="link-secundario center-align">
                <a href="/cadastrar_usuario" class="link-verde waves-effect">
                    Não tem conta? Registe-se
                </a>
            </p>

            <p class="link-voltar center-align">
                <a href="{{ url_for('pagina_escolha_login') }}" class="link-cinza waves-effect">
                    <i class="material-icons tiny left">arrow_back</i>
                    Voltar ao Início
                </a>
            </p>

        </div>
    </div>

    <!-- Materialize JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
    <script>
        // 1) Corrige as labels quando o browser faz autofill
        M.updateTextFields();

        // 2) Mostrar / ocultar senha
        document.querySelectorAll('.toggle-password').forEach(icon => {
            icon.addEventListener('click', () => {
                const input = document.getElementById(icon.dataset.target);
                const hidden = input.type === 'password';
                input.type = hidden ? 'text' : 'password';
                icon.textContent = hidden ? 'visibility_off' : 'visibility';
            });
        });

        // 3) Toast com a mensagem de erro do Flask
        const erroDiv = document.getElementById('erro-msg');
        if (erroDiv) {
            M.toast({
                html: '<i class="material-icons tiny">error_outline</i> ' + erroDiv.dataset.erro,
                classes: 'red darken-2 rounded',
                displayLength: 5000
            });
        }

        // 4) Validação antes do submit
        document.getElementById('form-login').addEventListener('submit', (e) => {
            const campos = e.target.querySelectorAll('.validate');
            let valido = true;
            campos.forEach(c => { if (!c.validity.valid) valido = false; });

            if (!valido) {
                e.preventDefault();
                M.toast({
                    html: '<i class="material-icons tiny">warning</i> Corrija os campos destacados',
                    classes: 'orange darken-3 rounded'
                });
            }
        });
    </script>
</body>
</html>
