
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Editar Música - Painel do Músico</title>

    <!-- Materialize CSS -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">

    <!-- Material Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons"
          rel="stylesheet">

    <!-- CSS próprio -->
    <link rel="stylesheet"
          href="{{ url_for('static', filename='editar_musica.css') }}">
</head>

<body>

    <main class="pagina">

        <div class="card-editar">

            <!-- CABEÇALHO -->
            <header class="cabecalho">
                <div class="icone-titulo">
                    <i class="material-icons">edit</i>
                </div>

                <div>
                    <h4>Editar Música</h4>
                    <p>Atualize as informações desta faixa</p>
                </div>
            </header>

            <div class="divisor"></div>

            <!-- FORMULÁRIO -->
            <form method="POST">

                <!-- TÍTULO -->
                <div class="campo-linha">
                    <i class="material-icons icone-campo">music_note</i>

                    <div class="campo-conteudo input-field">
                        <input
                            type="text"
                            id="titulo"
                            name="titulo"
                            value="{{ musica.titulo }}"
                            required
                        >
                        <label for="titulo" class="active">Título</label>
                    </div>
                </div>

                <!-- DURAÇÃO -->
                <div class="campo-linha">
                    <i class="material-icons icone-campo">schedule</i>

                    <div class="campo-conteudo input-field">
                        <input
                            type="text"
                            id="duracao"
                            name="duracao"
                            value="{{ musica.duracao }}"
                            required
                        >
                        <label for="duracao" class="active">Duração</label>
                    </div>
                </div>

                <!-- GÊNERO -->
                <div class="campo-linha">
                    <i class="material-icons icone-campo">category</i>

                    <div class="campo-conteudo input-field">
                        <select id="id_genero" name="id_genero" required>
                            {% for genero in generos %}
                                <option
                                    value="{{ genero.id_genero }}"
                                    {% if genero.id_genero == musica.id_genero %}selected{% endif %}
                                >
                                    {{ genero.nome_genero }}
                                </option>
                            {% endfor %}
                        </select>

                        <label>Gênero</label>
                    </div>
                </div>

                <!-- ÁLBUM -->
                <div class="campo-linha">
                    <i class="material-icons icone-campo">album</i>

                    <div class="campo-conteudo input-field">
                        <select id="id_album" name="id_album">
                            <option value="">Nenhum (Single)</option>

                            {% for album in albuns %}
                                <option
                                    value="{{ album.id_album }}"
                                    {% if album.id_album == musica.id_album %}selected{% endif %}
                                >
                                    {{ album.nome_album }}
                                </option>
                            {% endfor %}
                        </select>

                        <label>Álbum</label>
                    </div>
                </div>

                <div class="divisor divisor-final"></div>

                <!-- BOTÕES -->
                <div class="botoes">

                    <a href="{{ url_for('musico_listar_musicas', musico_id=musico_id) }}"
                       class="btn-cancelar">
                        Cancelar
                    </a>

                    <button type="submit" class="btn-salvar">
                        <i class="material-icons">save</i>
                        Salvar Alterações
                    </button>

                </div>

            </form>

        </div>

    </main>

    <!-- Materialize JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            var elementos = document.querySelectorAll('select');
            M.FormSelect.init(elementos);
        });
    </script>

</body>
</html>
