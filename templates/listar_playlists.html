
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>As suas Playlists</title>

    <!-- Materialize CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">

    <!-- Material Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

    <!-- DataTables CSS -->
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">

    <!-- CSS próprio -->
    <link rel="stylesheet" href="{{ url_for('static', filename='playlist.css') }}">
</head>

<body>

    <main class="container-principal">

        <a href="{{ url_for('usuario_home', usuario_id=usuario_id) }}" class="link-voltar">
            <i class="material-icons">arrow_back</i>
            Voltar ao Painel
        </a>

        <div class="cabecalho">
            <div>
                <h1>As suas Playlists</h1>
                <p>Gerencie e organize suas listas de músicas.</p>
            </div>

            <a href="{{ url_for('cadastrar_playlist_form', usuario_id=usuario_id) }}"
               class="btn-cadastrar">
                <i class="material-icons">add</i>
                Cadastrar Playlist
            </a>
        </div>

        <div class="linha-divisoria"></div>

        <section class="secao-playlists">

            <h2>Suas listas</h2>

            <div class="tabela-container">

                <table id="tabelaPlaylists" class="tabela-playlists">
                    <thead>
                        <tr>
                            <th>Nome da Playlist</th>
                            <th class="coluna-acoes">Ações</th>
                        </tr>
                    </thead>

                    <tbody>
                        {% if playlists %}
                            {% for playlist in playlists %}
                            <tr>
                                <td>
                                    <a href="{{ url_for('detalhes_playlist', usuario_id=usuario_id, playlist_id=playlist.id_playlist) }}"
                                       class="nome-playlist">
                                        <i class="material-icons">queue_music</i>
                                        {{ playlist.nome_playlist }}
                                    </a>
                                </td>

                                <td>
                                    <div class="acoes">

                                        <!-- Ver -->
                                        <a href="{{ url_for('detalhes_playlist', usuario_id=usuario_id, playlist_id=playlist.id_playlist) }}"
                                           class="btn-acao btn-ver">
                                            <i class="material-icons">visibility</i>
                                            Ver
                                        </a>

                                        <!-- Editar -->
                                        <a href="{{ url_for('editar_playlist', usuario_id=usuario_id, playlist_id=playlist.id_playlist) }}"
                                           class="btn-acao btn-editar">
                                            <i class="material-icons">edit</i>
                                            Editar
                                        </a>

                                        <!-- Excluir -->
                                        <form action="{{ url_for('excluir_playlist', usuario_id=usuario_id, playlist_id=playlist.id_playlist) }}"
                                              method="POST"
                                              onsubmit="return confirm('Tem certeza que deseja excluir esta playlist?')">

                                            <button type="submit" class="btn-acao btn-excluir">
                                                <i class="material-icons">delete</i>
                                                Excluir
                                            </button>

                                        </form>

                                    </div>
                                </td>
                            </tr>
                            {% endfor %}
                        {% endif %}
                    </tbody>
                </table>

            </div>

        </section>

    </main>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>

    <!-- DataTables JS -->
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>

    <script>
        $(document).ready(function() {
            $('#tabelaPlaylists').DataTable({
                language: {
                    url: 'https://cdn.datatables.net/plug-ins/1.13.6/i18n/pt-BR.json'
                },
                pageLength: 10,
                ordering: true,
                responsive: true
            });
        });
    </script>

</body>
</html>
