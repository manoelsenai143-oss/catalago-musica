<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>As suas Playlists</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='playlists.css') }}">

    <!-- DataTables CSS -->
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">

    <!-- Estilo para adaptar o DataTables ao tema escuro -->
    <style>
        .dataTables_wrapper { color: #fff; padding: 20px; background: #181818; border-radius: 6px; }
        .dataTables_wrapper input, .dataTables_wrapper select { background: #2a2a2a; color: #fff; border: 1px solid #444; border-radius: 4px; padding: 4px; }
        .dataTables_wrapper .dataTables_length, .dataTables_wrapper .dataTables_filter, .dataTables_wrapper .dataTables_info, .dataTables_wrapper .dataTables_paginate { color: #b3b3b3 !important; }
        .dataTables_wrapper .dataTables_paginate .paginate_button { color: #fff !important; }
        .dataTables_wrapper .dataTables_paginate .paginate_button.current { background: #1db954 !important; color: #fff !important; border: 1px solid #1db954 !important; }
    </style>
</head>
<body>

    <!-- Link para voltar ao painel do utilizador -->
    <a href="{{ url_for('usuario_home', usuario_id=usuario_id) }}" class="link-voltar">← Voltar ao Painel</a>

    <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 20px; margin-bottom: 20px;">
        <h1 style="color: #ffffff; margin: 0;">As suas Playlists</h1>

        <!-- Botão para criar nova playlist -->
        <a href="{{ url_for('cadastrar_playlist_form', usuario_id=usuario_id) }}" style="background: #1db954; color: white; padding: 10px 20px; border-radius: 4px; text-decoration: none; font-weight: bold;">
            + Cadastrar Playlist
        </a>
    </div>

    <hr style="margin: 20px 0; border: 0; border-top: 1px solid #333;">

    <p style="color: #b3b3b3; margin-bottom: 20px;">Lista de todas as tuas playlists guardadas na base de dados:</p>

    <!-- Tabela com ID para ativar o DataTable -->
    <table id="tabelaPlaylists" style="width: 100%; border-collapse: collapse; background: #181818; color: #fff; border-radius: 6px; overflow: hidden;">
        <thead>
            <tr style="background: #282828; text-align: left; border-bottom: 1px solid #333;">
                <th style="padding: 12px;">Nome da Playlist</th>
                <th style="padding: 12px; text-align: center; width: 220px;">Ações</th>
            </tr>
        </thead>
        <tbody>
            {% if playlists %}
                {% for playlist in playlists %}
                <tr style="border-bottom: 1px solid #222;">
                    <td style="padding: 12px;">
                        <a href="{{ url_for('detalhes_playlist', usuario_id=usuario_id, playlist_id=playlist.id_playlist) }}" style="color: #1db954; text-decoration: none; font-weight: bold;">
                            {{ playlist.nome_playlist }}
                        </a>
                    </td>
                    <td style="padding: 12px; text-align: center;">
                        <div style="display: flex; justify-content: center; gap: 8px;">
                            <!-- Botão Ver -->
                            <a href="{{ url_for('detalhes_playlist', usuario_id=usuario_id, playlist_id=playlist.id_playlist) }}" style="background: #2a2a2a; color: white; border: 1px solid #444; padding: 6px 12px; border-radius: 4px; text-decoration: none; font-size: 0.9em; font-weight: bold;">
                                Ver
                            </a>

                            <!-- Botão Editar -->
                            <a href="{{ url_for('editar_playlist', usuario_id=usuario_id, playlist_id=playlist.id_playlist) }}" style="background: #ffa726; color: white; border: 1px solid #fb8c00; padding: 6px 12px; border-radius: 4px; text-decoration: none; font-size: 0.9em; font-weight: bold;">
                                Editar
                            </a>

                            <!-- Botão Eliminar -->
                            <form action="{{ url_for('excluir_playlist', usuario_id=usuario_id, playlist_id=playlist.id_playlist) }}" method="POST" style="margin: 0;">
                                <button type="submit" style="background: #ff5252; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 0.9em; font-weight: bold;" onclick="return confirm('Tens a certeza que queres eliminar esta playlist?')">
                                    Eliminar
                                </button>
                            </form>
                        </div>
                    </td>
                </tr>
                {% endfor %}
            {% endif %}
        </tbody>
    </table>

    <!-- jQuery e DataTables JS -->
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>

    <script>
        $(document).ready(function() {
            $('#tabelaPlaylists').DataTable({
                "language": {
                    "url": "//cdn.datatables.net/plug-ins/1.13.6/i18n/pt-PT.json"
                }
            });
        });
    </script>

</body>
</html>
