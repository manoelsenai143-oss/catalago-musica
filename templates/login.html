<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escolher Tipo de Login</title>

    <!-- Materialize CSS -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
    <!-- Material Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <!-- CSS específico desta página -->
    <link rel="stylesheet" href="{{ url_for('static', filename='login.css') }}">
</head>
<body>

    <div class="container">
        <div class="row">
            <div class="col s12 m8 offset-m2 l6 offset-l3">

                <div class="card dark-card z-depth-3">
                    <div class="card-content center-align">

                        <h4 class="white-text titulo-escolha">
                            <i class="material-icons medium">account_circle</i>
                            <br>
                            Escolha o seu Perfil
                        </h4>

                        <p class="subtitulo">Selecione o tipo de conta para continuar</p>

                        <!-- Admin -->
                        <a href="/login/admin"
                           class="btn-large waves-effect waves-light btn-role">
                            <i class="material-icons left">admin_panel_settings</i>
                            Administrador
                        </a>

                        <!-- Músico -->
                        <a href="/login/musico"
                           class="btn-large waves-effect waves-light btn-role">
                            <i class="material-icons left">music_note</i>
                            Músico (CPF)
                        </a>

                        <!-- Utilizador -->
                        <a href="/login/usuario"
                           class="btn-large waves-effect waves-light btn-role">
                            <i class="material-icons left">person</i>
                            Utilizador
                        </a>

                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Materialize JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
</body>
</html>
