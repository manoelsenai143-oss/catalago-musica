<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adicionar Música à Playlist</title>

    <!-- Materialize CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">

    <!-- Material Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

    <!-- Select2 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet">

    <!-- CSS próprio -->
    <link rel="stylesheet" href="{{ url_for('static', filename='adicionar.css') }}">

    <style>
        /* Estilos para alinhar perfeitamente a miniatura no Select2 */
        .select2-option-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .select2-option-img {
            width: 32px;
            height: 32px;
            border-radius: 4px;
            object-fit: cover;
        }
    </style>
</head>

<body>

    <main class="container-principal">

        <a href="{{ url_for('detalhes_playlist', usuario_id=usuario_id, playlist_id=playlist_id) }}"
           class="link-voltar">
            <i class="material-icons">arrow_back</i>
            Voltar aos detalhes
        </a>

        <div class="card-adicionar">

            <div class="icone-musica">
                <i class="material-icons">library_music</i>
            </div>

            <h1>Adicionar Música</h1>

            <p class="descricao">
                Escolha uma música do catálogo para adicionar à sua playlist.
            </p>

            <form method="POST">

                <div class="campo-musica">
                    <label for="selectMusica">Escolha uma música</label>

                    <select name="id_musica" id="selectMusica" required>
                        <option value=""></option>

                        {% for musica in musicas %}
                            <option value="{{ musica.id_musica }}" data-capa="{{ musica.capa_url or '' }}">
                                {{ musica.titulo }} — {{ musica.artista }}
                            </option>
                        {% endfor %}
                    </select>
                </div>

                <button type="submit" class="btn-adicionar">
                    <i class="material-icons">add</i>
                    Adicionar à Playlist
                </button>

            </form>

        </div>

    </main>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>

    <!-- Materialize JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>

    <!-- Select2 JS -->
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

    <script>
        $(document).ready(function() {
            function formatState (state) {
                if (!state.id) {
                    return state.text;
                }
                var baseUrl = $(state.element).data('capa');
                var $state;

                if (baseUrl) {
                    $state = $(
                        '<div class="select2-option-container"><img src="' + baseUrl + '" class="select2-option-img" /><span>' + state.text + '</span></div>'
                    );
                } else {
                    $state = $(
                        '<div class="select2-option-container"><div style="width: 32px; height: 32px; background: #333; border-radius: 4px; display: flex; align-items: center; justify-content: center;"><i class="material-icons" style="font-size: 16px; color: #777;">music_note</i></div><span>' + state.text + '</span></div>'
                    );
                }
                return $state;
            };

            $('#selectMusica').select2({
                placeholder: "Pesquise pelo título ou artista...",
                allowClear: true,
                width: '100%',
                templateResult: formatState,
                templateSelection: formatState
            });
        });
    </script>

</body>
</html>
