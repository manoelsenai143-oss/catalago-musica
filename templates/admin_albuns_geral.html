
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Moderação de Álbuns</title>

    <!-- Materialize CSS -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">

    <!-- Material Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

    <!-- DataTables CSS -->
    <link rel="stylesheet"
          href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">

    <!-- CSS personalizado -->
    <link rel="stylesheet"
          href="{{ url_for('static', filename='admin_albuns.css') }}">
</head>

<body>

    <div class="container-painel">

        <!-- Cabeçalho -->
        <div class="cabecalho">
            <h4>
                <i class="material-icons">album</i>
                Moderação Global de Álbuns
            </h4>

            <a href="{{ url_for('exportar_albuns_pdf') }}"
               class="btn-exportar">
                <i class="material-icons left">picture_as_pdf</i>
                Exportar PDF
            </a>
        </div>

        <!-- Tabela de álbuns -->
        <div class="tabela-container">

            <table id="tabelaAlbuns" class="highlight responsive-table">

                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nome do Álbum</th>
                        <th>Artista</th>
                        <th>Ano</th>
                        <th class="coluna-acoes">Ações</th>
                    </tr>
                </thead>

                <tbody>
                    {% for a in albuns %}
                    <tr>
                        <td>{{ a.id_album }}</td>
                        <td>{{ a.nome_album }}</td>
                        <td>{{ a.artista }}</td>
                        <td>{{ a.ano_album }}</td>

                        <td class="coluna-acoes">
                            <form
                                action="{{ url_for('admin_excluir_album_global', id_album=a.id_album) }}"
                                method="POST"
                                onsubmit="return confirm('Atenção: Excluir este álbum removerá também todas as músicas associadas a ele. Deseja continuar?');">

                                <button type="submit" class="btn-excluir">
                                    <i class="material-icons">delete</i>
                                    Excluir
                                </button>

                            </form>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>

            </table>

        </div>

        <!-- Voltar -->
        <a href="{{ url_for('admin_home') }}" class="btn-voltar">
            <i class="material-icons left">arrow_back</i>
            Voltar ao Painel Admin
        </a>

    </div>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>

    <!-- Materialize JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>

    <!-- DataTables JS -->
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>

    <!-- Configuração DataTables -->
    <script>
        $(document).ready(function () {
            $('#tabelaAlbuns').DataTable({
                language: {
                    url: "//cdn.datatables.net/plug-ins/1.13.6/i18n/pt-BR.json"
                },
                pageLength: 10,
                ordering: true,
                responsive: true,
                columnDefs: [
                    {
                        orderable: false,
                        targets: 4
                    }
                ]
            });
        });
    </script>

</body>
</html>
