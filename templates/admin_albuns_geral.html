<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Moderação de Álbuns</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body style="background-color: #121212; color: #fff; font-family: Arial, sans-serif; padding: 40px;">
    <div style="max-width: 850px; margin: auto; background: #181818; padding: 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.5);">
        <h2 style="color: #9b59b6; margin-bottom: 20px;">💿 Moderação Global de Álbuns</h2>

        <table style="width: 100%; border-collapse: collapse; margin-bottom: 20px;">
            <thead>
                <tr style="background: #282828; text-align: left;">
                    <th style="padding: 10px;">ID</th>
                    <th style="padding: 10px;">Nome do Álbum</th>
                    <th style="padding: 10px;">Artista</th>
                    <th style="padding: 10px;">Ano</th>
                    <th style="padding: 10px; text-align: center;">Ações</th>
                </tr>
            </thead>
            <tbody>
                {% for a in albuns %}
                <tr style="border-bottom: 1px solid #333;">
                    <td style="padding: 10px;">{{ a.id_album }}</td>
                    <td style="padding: 10px;">{{ a.nome_album }}</td>
                    <td style="padding: 10px;">{{ a.artista }}</td>
                    <td style="padding: 10px;">{{ a.ano_album }}</td>
                    <td style="padding: 10px; text-align: center;">
                        <form action="{{ url_for('admin_excluir_album_global', id_album=a.id_album) }}" method="POST" style="display:inline;">
                            <button type="submit" onclick="return confirm('Atenção: Excluir este álbum removerá também todas as músicas associadas a ele. Deseja continuar?');" style="background: #e74c3c; color: #fff; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer;">Excluir</button>
                        </form>
                    </td>
                </tr>
                {% else %}
                <tr>
                    <td colspan="5" style="padding: 15px; text-align: center; color: #b3b3b3;">Nenhum álbum registado na plataforma.</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>

        <a href="{{ url_for('admin_home') }}" style="color: #b3b3b3; text-decoration: none;">← Voltar ao Painel Admin</a>
    </div>
</body>
</html>
