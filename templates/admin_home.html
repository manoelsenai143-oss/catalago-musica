<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Painel do Administrador</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Painel Admin</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link text-danger" href="{{ url_for('logout') }}">Terminar Sessão</a>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <h2 class="mb-4">Visão Geral da Plataforma</h2>

        <div class="row text-center">
            <div class="col-md-3 mb-3">
                <div class="card text-white bg-primary shadow-sm">
                    <div class="card-body">
                        <h5>Utilizadores</h5>
                        <h3>{{ total_usuarios }}</h3>
                    </div>
                </div>
            </div>
            <div class="col-md-3 mb-3">
                <div class="card text-white bg-success shadow-sm">
                    <div class="card-body">
                        <h5>Músicos</h5>
                        <h3>{{ total_musicos }}</h3>
                    </div>
                </div>
            </div>
            <div class="col-md-3 mb-3">
                <div class="card text-white bg-warning shadow-sm">
                    <div class="card-body">
                        <h5>Músicas</h5>
                        <h3>{{ total_musicas }}</h3>
                    </div>
                </div>
            </div>
            <div class="col-md-3 mb-3">
                <div class="card text-white bg-info shadow-sm">
                    <div class="card-body">
                        <h5>Álbuns</h5>
                        <h3>{{ total_albuns }}</h3>
                    </div>
                </div>
            </div>
        </div>

        <div class="mt-4">
            <h4>Ações Rápidas</h4>
            <a href="{{ url_for('admin_gerenciar_generos') }}" class="btn btn-dark mt-2">Gerir Géneros Musicais</a>
        </div>
    </div>
</body>
</html>
