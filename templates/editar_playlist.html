
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Editar Playlist</title>

    <!-- Materialize CSS -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">

    <!-- Material Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

    <!-- CSS personalizado -->
    <link rel="stylesheet"
          href="{{ url_for('static', filename='editar_playlist.css') }}">
</head>

<body>

    <div class="container-formulario">

        <!-- Voltar -->
        <a href="{{ url_for('listar_playlists', usuario_id=usuario_id) }}"
           class="link-voltar">
            <i class="material-icons">arrow_back</i>
            Voltar às Playlists
        </a>

        <!-- Formulário -->
        <div class="card-formulario">

            <div class="titulo-formulario">
                <i class="material-icons">edit_note</i>
                <h4>Editar Playlist</h4>
            </div>

            <form method="POST">

                <div class="input-campo">
                    <label for="nome_playlist">Nome da Playlist</label>

                    <input
                        type="text"
                        id="nome_playlist"
                        name="nome_playlist"
                        value="{{ playlist.nome_playlist }}"
                        required
                        placeholder="Digite o nome da playlist">
                </div>

                <button type="submit" class="btn-salvar">
                    <i class="material-icons left">save</i>
                    Salvar Alterações
                </button>

            </form>

        </div>

    </div>

    <!-- Materialize JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>

</body>
</html>
