<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registar - Músico</title>

    <!-- Materialize CSS -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
    <!-- Material Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <!-- CSS específico desta página -->
    <link rel="stylesheet" href="{{ url_for('static', filename='cadastrar_musico.css') }}">
</head>
<body>

    <div class="container">
        <div class="row">
            <div class="col s12 m8 offset-m2 l6 offset-l3">

                <div class="card dark-card z-depth-3">
                    <div class="card-content">

                        <h4 class="center-align white-text">
                            <i class="material-icons medium">music_note</i>
                            <br>
                            Registrar Artista
                        </h4>

                        {% if erro %}
                        <div id="erro-msg" data-erro="{{ erro }}" class="mensagem-erro">
                            <i class="material-icons tiny">error_outline</i>
                            {{ erro }}
                        </div>
                        {% endif %}

                        <form action="/cadastrar_musico" method="POST"
                              id="form-musico" novalidate>

                            <!-- Nome do Artista -->
                            <div class="input-field">
                                <i class="material-icons prefix">person</i>
                                <input type="text" id="nome" name="nome"
                                       class="validate" required minlength="3"
                                       autocomplete="name">
                                <label for="nome">Nome do Artista</label>
                                <span class="helper-text"
                                      data-error="Mínimo 3 caracteres"
                                      data-success=""></span>
                            </div>

                            <!-- CPF (com máscara) -->
                            <div class="input-field">
                                <i class="material-icons prefix">badge</i>
                                <input type="text" id="cpf" name="cpf"
                                       class="validate"
                                       pattern="\d{3}\.\d{3}\.\d{3}-\d{2}"
                                       maxlength="14"
                                       inputmode="numeric"
                                       oninput="mascaraCPF(this)"
                                       required>
                                <label for="cpf">CPF</label>
                                <span class="helper-text"
                                      data-error="CPF inválido (000.000.000-00)"
                                      data-success=""></span>
                            </div>

                            <!-- Senha -->
                            <div class="input-field">
                                <i class="material-icons prefix">lock</i>
                                <input type="password" id="senha" name="senha"
                                       class="validate" required minlength="6"
                                       autocomplete="new-password">
                                <label for="senha">Senha</label>
                                <span class="helper-text"
                                      data-error="Mínimo 6 caracteres"
                                      data-success=""></span>
                                <i class="material-icons toggle-password"
                                   data-target="senha"
                                   title="Mostrar / ocultar senha">visibility</i>
                            </div>

                            <!-- Botão -->
                            <button type="submit"
                                    class="btn-large waves-effect waves-light btn-musico">
                                Cadastrar Músico
                                <i class="material-icons right">how_to_reg</i>
                            </button>

                        </form>

                        <div class="divider"></div>

                        <p class="center-align link-voltar">
                            <a href="{{ url_for('login_musico') }}"
                               class="link-cinza waves-effect">
                                <i class="material-icons tiny left">arrow_back</i>
                                Voltar ao Login
                            </a>
                        </p>

                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Materialize JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
    <script>
        // 1) Corrige labels quando o browser faz autofill
        M.updateTextFields();

        // 2) Máscara do CPF (mantida do original)
        function mascaraCPF(i) {
            let v = i.value;
            v = v.replace(/\D/g, ""); // Remove tudo o que não for número
            v = v.replace(/^(\d{3})(\d)/, "$1.$2");
            v = v.replace(/^(\d{3})\.(\d{3})(\d)/, "$1.$2.$3");
            v = v.replace(/^(\d{3})\.(\d{3})\.(\d{3})(\d{1,2})$/, "$1.$2.$3-$4");
            i.value = v;
        }

        // 3) Mostrar / ocultar senha
        document.querySelectorAll('.toggle-password').forEach(icon => {
            icon.addEventListener('click', () => {
                const input = document.getElementById(icon.dataset.target);
                const hidden = input.type === 'password';
                input.type = hidden ? 'text' : 'password';
                icon.textContent = hidden ? 'visibility_off' : 'visibility';
            });
        });

        // 4) Toast com a mensagem de erro vinda do Flask
        const erroDiv = document.getElementById('erro-msg');
        if (erroDiv) {
            M.toast({
                html: '<i class="material-icons tiny">error_outline</i> ' + erroDiv.dataset.erro,
                classes: 'red darken-2 rounded',
                displayLength: 5000
            });
        }

        // 5) Validação antes do submit
        document.getElementById('form-musico').addEventListener('submit', (e) => {
            const campos = e.target.querySelectorAll('.validate');
            let valido = true;
            campos.forEach(c => { if (!c.validity.valid) valido = false; });

            if (!valido) {
                e.preventDefault();
                M.toast({
                    html: '<i class="material-icons tiny">warning</i> Corrija os campos destacados',
                    classes: 'orange darken-3 rounded'
                });
            }
        });
    </script>
</body>
</html>
