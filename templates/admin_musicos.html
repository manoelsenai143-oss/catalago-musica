<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Gerenciar Músicos</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body style="background-color: #121212; color: #fff; font-family: Arial, sans-serif; padding: 40px;">
    <div style="max-width: 800px; margin: auto; background: #181818; padding: 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.5);">
        <h2 style="color: #f39c12; margin-bottom: 20px;">🎸 Gestão de Músicos</h2>

        <table style="width: 100%; border-collapse: collapse; margin-bottom: 20px;">
            <thead>
                <tr style="background: #282828; text-align: left;">
                    <th style="padding: 10px;">ID</th>
                    <th style="padding: 10px;">Nome</th>
                    <th style="padding: 10px;">CPF</th>
                    <th style="padding: 10px; text-align: center;">Ações</th>
                </tr>
            </thead>
            <tbody>
                {% for m in musicos %}
                <tr style="border-bottom: 1px solid #333;">
                    <td style="padding: 10px;">{{ m.id }}</td>
                    <td style="padding: 10px;">{{ m.nome }}</td>
                    <td style="padding: 10px;">{{ m.cpf }}</td>
                    <td style="padding: 10px; text-align: center;">
                        <form action="{{ url_for('admin_excluir_musico', musico_id=m.id) }}" method="POST" style="display:inline;">
                            <button type="submit" onclick="return confirm('Atenção: Excluir este músico removerá todos os seus álbuns e músicas. Deseja continuar?');" style="background: #e74c3c; color: #fff; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer;">Excluir</button>
                        </form>
                    </td>
                </tr>
                {% else %}
                <tr>
                    <td colspan="4" style="padding: 15px; text-align: center; color: #b3b3b3;">Nenhum músico registado.</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>

        <a href="{{ url_for('admin_home') }}" style="color: #b3b3b3; text-decoration: none;">← Voltar ao Painel Admin</a>
    </div>
</body>
</html>
