<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registo de Novo Utilizador</title>
    <!-- Liga o CSS específico desta página a partir da pasta static -->
    <link rel="stylesheet" href="{{ url_for('static', filename='cadastrar_usuario.css') }}">
</head>
<body>

    <h2>Registo de Novo Utilizador</h2>

    {% if erro %}
        <p class="mensagem-erro">{{ erro }}</p>
    {% endif %}

    <form action="{{ url_for('cadastrar_usuario') }}" method="POST">
        <label for="nome_usuario">Nome de Utilizador:</label>
        <input type="text" id="nome_usuario" name="nome_usuario" required>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>

        <label for="senha">Senha:</label>
        <input type="password" id="senha" name="senha" required>

        <button type="submit">Cadastrar</button>
    </form>

    <a href="{{ url_for('login_usuario') }}">Já tem conta? Faça login</a>

</body>
</html>
