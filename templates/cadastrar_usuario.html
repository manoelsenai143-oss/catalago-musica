<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registo de Novo Utilizador</title>

    <!-- Materialize CSS -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
    <!-- Material Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <!-- CSS específico desta página -->
    <link rel="stylesheet" href="{{ url_for('static', filename='cadastrar_usuario.css') }}">
</head>
<body>

    <div class="container">
        <div class="row">
            <div class="col s12 m8 offset-m2 l6 offset-l3">

                <div class="card dark-card z-depth-3">
                    <div class="card-content">

                        <h4 class="center-align white-text">
                            <i class="material-icons medium">person_add</i>
                            <br>
                            Registo de Novo Utilizador
                        </h4>

                        {% if erro %}
                        <div class="card-panel red darken-2 white-text center-align"
                             id="erro-msg" data-erro="{{ erro }}">
                            <i class="material-icons tiny">error_outline</i>
                            {{ erro }}
                        </div>
                        {% endif %}

                        <form action="{{ url_for('cadastrar_usuario') }}"
                              method="POST" id="form-cadastro" novalidate>

                            <!-- Nome -->
                            <div class="input-field">
                                <i class="material-icons prefix">account_circle</i>
                                <input type="text" id="nome_usuario" name="nome_usuario"
                                       class="validate" required minlength="3">
                                <label for="nome_usuario">Nome de Utilizador</label>
                                <span class="helper-text"
                                      data-error="Mínimo 3 caracteres"
                                      data-success=""></span>
                            </div>

                            <!-- Email -->
                            <div class="input-field">
                                <i class="material-icons prefix">email</i>
                                <input type="email" id="email" name="email"
                                       class="validate" required>
                                <label for="email">Email</label>
                                <span class="helper-text"
                                      data-error="Email inválido"
                                      data-success=""></span>
                            </div>

                            <!-- Senha -->
                            <div class="input-field">
                                <i class="material-icons prefix">lock</i>
                                <input type="password" id="senha" name="senha"
                                       class="validate" required minlength="6">
                                <label for="senha">Senha</label>
                                <span class="helper-text"
                                      data-error="Mínimo 6 caracteres"
                                      data-success=""></span>
                                <i class="material-icons toggle-password"
                                   data-target="senha"
                                   title="Mostrar / ocultar senha">visibility</i>
                            </div>

                            <!-- Botão -->
                            <button type="submit"
                                    class="btn-large waves-effect waves-light btn-cadastrar">
                                Cadastrar
                                <i class="material-icons right">send</i>
                            </button>

                        </form>

                        <div class="divider"></div>

                        <div class="center-align login-link">
                            <a href="{{ url_for('login_usuario') }}"
                               class="btn-flat waves-effect">
                                <i class="material-icons left">login</i>
                                Já tem conta? Faça login
                            </a>
                        </div>

                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Materialize JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
    <script>
        // 1) Corrige labels quando o browser faz autofill
        M.updateTextFields();

        // 2) Mostrar / ocultar senha
        document.querySelectorAll('.toggle-password').forEach(icon => {
            icon.addEventListener('click', () => {
                const input = document.getElementById(icon.dataset.target);
                const hidden = input.type === 'password';
                input.type = hidden ? 'text' : 'password';
                icon.textContent = hidden ? 'visibility_off' : 'visibility';
            });
        });

        // 3) Toast com a mensagem de erro vinda do Flask
        const erroDiv = document.getElementById('erro-msg');
        if (erroDiv) {
            M.toast({
                html: '<i class="material-icons tiny">error_outline</i> ' + erroDiv.dataset.erro,
                classes: 'red darken-2 rounded',
                displayLength: 5000
            });
        }

        // 4) Validação antes do submit
        document.getElementById('form-cadastro').addEventListener('submit', (e) => {
            const campos = e.target.querySelectorAll('.validate');
            let valido = true;
            campos.forEach(c => { if (!c.validity.valid) valido = false; });

            if (!valido) {
                e.preventDefault();
                M.toast({
                    html: '<i class="material-icons tiny">warning</i> Corrija os campos destacados',
                    classes: 'orange darken-3 rounded'
                });
            }
        });
    </script>
</body>
</html>
