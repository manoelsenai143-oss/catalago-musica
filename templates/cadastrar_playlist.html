
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Playlist</title>

    <!-- Materialize CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">

    <!-- Material Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

    <!-- CSS próprio -->
    <link rel="stylesheet" href="{{ url_for('static', filename='cadastrar_playlist.css') }}">
</head>
<body>

    <main class="container-principal">

        <a href="{{ url_for('listar_playlists', usuario_id=usuario_id) }}" class="link-voltar">
            <i class="material-icons">arrow_back</i>
            Voltar às Playlists
        </a>

        <div class="card-cadastro">

            <div class="icone-playlist">
                <i class="material-icons">queue_music</i>
            </div>

            <h1>Cadastrar Nova Playlist</h1>

            <p class="descricao">
                Crie sua própria playlist e organize suas músicas favoritas.
            </p>

            <form action="{{ url_for('criar_playlist', usuario_id=usuario_id) }}" method="POST">

                <div class="campo">
                    <label for="nome_playlist">Nome da Playlist</label>

                    <input
                        type="text"
                        id="nome_playlist"
                        name="nome_playlist"
                        placeholder="Ex: Rock dos Anos 80"
                        required
                    >
                </div>

                <button type="submit" class="btn-cadastrar">
                    <i class="material-icons">add</i>
                    Criar Playlist
                </button>

            </form>

        </div>

    </main>

</body>
</html>
