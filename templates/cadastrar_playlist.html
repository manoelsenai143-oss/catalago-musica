<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Playlist</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='playlists.css') }}">
</head>
<body>

    <div style="max-width: 500px; margin: 60px auto; background: #1e1e1e; padding: 30px; border-radius: 8px; border: 1px solid #333;">

        <!-- Link para voltar atrás -->
        <a href="{{ url_for('listar_playlists', usuario_id=usuario_id) }}" style="color: #1db954; text-decoration: none; font-weight: bold;">← Voltar às Playlists</a>

        <h2 style="color: #ffffff; margin-top: 20px; margin-bottom: 5px;">Cadastrar Nova Playlist</h2>
        <p style="color: #b3b3b3; margin-bottom: 25px; font-size: 0.95em;">Insere o nome para criar a tua nova lista de músicas.</p>

        <!-- Formulário que envia os dados para a rota POST -->
        <form action="{{ url_for('criar_playlist', usuario_id=usuario_id) }}" method="POST">
            <div style="margin-bottom: 20px;">
                <label style="display: block; color: #ffffff; margin-bottom: 8px; font-weight: bold;">Nome da Playlist</label>
                <input type="text" name="nome_playlist" placeholder="Ex: Rock dos Anos 80" required
                       style="width: 100%; padding: 12px; background: #2a2a2a; border: 1px solid #444; color: white; border-radius: 4px; box-sizing: border-box; font-size: 1em;">
            </div>

            <button type="submit" style="background: #1db954; color: white; border: none; padding: 12px 20px; border-radius: 4px; font-weight: bold; cursor: pointer; width: 100%; font-size: 1em;">
                Guardar Playlist
            </button>
        </form>
    </div>

</body>
</html>
