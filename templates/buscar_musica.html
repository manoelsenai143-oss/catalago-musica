<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Catálogo de Músicas</title>

    <!-- 1. Importar CSS do DataTables -->
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
</head>
<body>

    <h2>Catálogo de Músicas</h2>

    <!-- A tua tabela de músicas -->
    <table id="tabelaMusicas" class="display" style="width:100%">
        <thead>
            <tr>
                <th>ID</th>
                <th>Título</th>
                <th>Duração</th>
                <th>Artista</th>
                <th>Álbum</th>
                <th>Género</th>
                <!-- A coluna de Ações foi removida daqui! -->
            </tr>
        </thead>
        <tbody>
            {% for musica in musicas %}
            <tr>
                <td>{{ musica.id }}</td>
                <td>{{ musica.titulo }}</td>
                <td>{{ musica.duracao }}</td>
                <td>{{ musica.artista if musica.artista else 'N/A' }}</td>
                <td>{{ musica.album if musica.album else 'N/A' }}</td>
                <td>{{ musica.genero }}</td>
                <!-- Sem botões de Editar ou Excluir -->
            </tr>
            {% endfor %}
        </tbody>
    </table>

    <!-- 2. Importar jQuery e o JS do DataTables -->
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>

    <!-- 3. Ativar o DataTables na tabela -->
    <script>
        $(document).ready(function() {
            $('#tabelaMusicas').DataTable({
                "language": {
                    "url": "//cdn.datatables.net/plug-ins/1.13.6/i18n/pt-PT.json" // Traduz para português
                }
            });
        });
    </script>

</body>
</html>
