<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Login - Administrador</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body style="background-color: #121212; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0;">
    <div style="background-color: #181818; padding: 40px; border-radius: 10px; width: 350px; box-shadow: 0 4px 10px rgba(0,0,0,0.5);">
        <h2 style="color: #e74c3c; margin-bottom: 20px;">🔒 Painel Admin</h2>
        
        <!-- Mensagem de erro caso o login falhe -->
        {% if erro %}
            <p style="color: #e74c3c; background-color: rgba(231, 76, 60, 0.1); padding: 10px; border-radius: 5px; text-align: center; margin-bottom: 15px; font-size: 0.9rem;">{{ erro }}</p>
        {% endif %}

        <!-- O action aponta explicitamente para a rota do admin no Flask -->
        <form action="{{ url_for('login_admin_page') }}" method="POST">
            <label style="display: block; margin-bottom: 5px;">Utilizador:</label>
            <input type="text" name="usuario" placeholder="admin" required style="width: 100%; padding: 10px; margin-bottom: 15px; background: #333; border: none; color: #fff; border-radius: 5px;">

            <label style="display: block; margin-bottom: 5px;">Senha:</label>
            <input type="password" name="senha" placeholder="********" required style="width: 100%; padding: 10px; margin-bottom: 20px; background: #333; border: none; color: #fff; border-radius: 5px;">

            <button type="submit" style="width: 100%; padding: 10px; background-color: #e74c3c; color: #fff; border: none; border-radius: 5px; font-weight: bold; cursor: pointer;">Entrar como Admin</button>
        </form>

        <p style="margin-top: 20px; text-align: center;"><a href="{{ url_for('pagina_escolha_login') }}" style="color: #b3b3b3; text-decoration: none;">← Voltar ao Início</a></p>
    </div>
</body>
</html>
