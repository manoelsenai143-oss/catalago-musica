<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Gerir Géneros Musicais</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <a href="{{ url_for('admin_home') }}" class="btn btn-secondary mb-3">&larr; Voltar ao Painel</a>

        <h2>Gerir Géneros Musicais</h2>

        <!-- Formulário para Adicionar Género -->
        <div class="card p-4 mt-3 shadow-sm">
            <form method="POST">
                <div class="mb-3">
                    <label for="nome_genero" class="form-label">Nome do Novo Género</label>
                    <input type="text" class="form-control" id="nome_genero" name="nome_genero" required>
                </div>
                <button type="submit" class="btn btn-success">Adicionar Género</button>
            </form>
        </div>

        <!-- Tabela de Géneros Existentes -->
        <div class="card p-4 mt-4 shadow-sm">
            <h4>Géneros Cadastrados</h4>
            <table class="table table-striped mt-3">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nome do Género</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody>
                    {% for genero in generos %}
                    <tr>
                        <td>{{ genero.id_genero }}</td>
                        <td>{{ genero.nome_genero }}</td>
                        <td>
                            <form action="{{ url_for('admin_excluir_genero', id_genero=genero.id_genero) }}" method="POST" style="display:inline;">
                                <button type="submit" class="btn btn-danger btn-sm" onclick="return confirm('Tens a certeza que queres apagar este género?')">Eliminar</button>
                            </form>
                        </td>
                    </tr>
                    {% else %}
                    <tr>
                        <td colspan="3" class="text-center">Ainda não existem géneros cadastrados.</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
