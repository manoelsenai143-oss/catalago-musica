<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Gerenciar Géneros</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body style="background-color: #121212; color: #fff; font-family: Arial, sans-serif; padding: 40px;">
    <div style="max-width: 600px; margin: auto; background: #181818; padding: 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.5);">
        <h2 style="color: #3498db; margin-bottom: 20px;">🎵 Gestão de Géneros</h2>

        <!-- Formulário para Adicionar Novo Género -->
        <form action="{{ url_for('admin_gerenciar_generos') }}" method="POST" style="margin-bottom: 25px; display: flex; gap: 10px;">
            <input type="text" name="nome_genero" placeholder="Nome do novo género" required style="flex: 1; padding: 10px; background: #333; border: none; color: #fff; border-radius: 5px;">
            <button type="submit" style="background: #3498db; color: #fff; border: none; padding: 10px 20px; border-radius: 5px; font-weight: bold; cursor: pointer;">Adicionar</button>
        </form>

        <!-- Tabela de Géneros Existentes -->
        <table style="width: 100%; border-collapse: collapse; margin-bottom: 20px;">
            <thead>
                <tr style="background: #282828; text-align: left;">
                    <th style="padding: 10px;">ID</th>
                    <th style="padding: 10px;">Nome do Género</th>
                    <th style="padding: 10px; text-align: center;">Ações</th>
                </tr>
            </thead>
            <tbody>
                {% for g in generos %}
                <tr style="border-bottom: 1px solid #333;">
                    <td style="padding: 10px;">{{ g.id_genero }}</td>
                    <td style="padding: 10px;">{{ g.nome_genero }}</td>
                    <td style="padding: 10px; text-align: center;">
                        <!-- IMPORTANTE: Passa o parâmetro id_genero corretamente aqui -->
                        <form action="{{ url_for('admin_excluir_genero', id_genero=g.id_genero) }}" method="POST" style="display:inline;">
                            <button type="submit" onclick="return confirm('Tem certeza que deseja excluir este género?');" style="background: #e74c3c; color: #fff; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer;">Excluir</button>
                        </form>
                    </td>
                </tr>
                {% else %}
                <tr>
                    <td colspan="3" style="padding: 15px; text-align: center; color: #b3b3b3;">Nenhum género registado.</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>

        <a href="{{ url_for('admin_home') }}" style="color: #b3b3b3; text-decoration: none;">← Voltar ao Painel Admin</a>
    </div>
</body>
</html>
