
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastrar Álbum - Painel do Músico</title>

    <!-- MATERIALIZE CSS -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">

    <!-- MATERIAL ICONS -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons"
          rel="stylesheet">

    <!-- CSS PRÓPRIO -->
    <link rel="stylesheet"
          href="{{ url_for('static', filename='cadastrar_album.css') }}">
</head>

<body>

    <main class="pagina">

        <div class="card-cadastro">

            <!-- CABEÇALHO -->
            <header class="cabecalho">

                <div class="icone-titulo">
                    <i class="material-icons">album</i>
                </div>

                <div>
                    <h4>Novo Álbum</h4>
                    <p>Cadastre um novo álbum no sistema</p>
                </div>

            </header>

            <div class="divisor"></div>

            <!-- FORMULÁRIO -->
            <form action="{{ url_for('musico_cadastrar_album', musico_id=musico_id) }}"
                  method="POST">

                <!-- NOME DO ÁLBUM -->
                <div class="campo-linha">

                    <i class="material-icons icone-campo">album</i>

                    <div class="campo-conteudo input-field">

                        <input
                            type="text"
                            id="nome_album"
                            name="nome_album"
                            required
                        >

                        <label for="nome_album">Nome do Álbum</label>

                    </div>

                </div>

                <!-- ANO DO ÁLBUM -->
                <div class="campo-linha">

                    <i class="material-icons icone-campo">calendar_today</i>

                    <div class="campo-conteudo input-field">

                        <input
                            type="number"
                            id="ano_album"
                            name="ano_album"
                            min="1900"
                            max="2100"
                            required
                        >

                        <label for="ano_album">Ano do Álbum</label>

                    </div>

                </div>

                <div class="divisor divisor-final"></div>

                <!-- BOTÕES -->
                <div class="botoes">

                    <a href="{{ url_for('musico_home', musico_id=musico_id) }}"
                       class="btn-cancelar">

                        Cancelar

                    </a>

                    <button type="submit" class="btn-salvar">

                        <i class="material-icons">save</i>
                        Criar Álbum

                    </button>

                </div>

            </form>

        </div>

    </main>

    <!-- MATERIALIZE JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>

</body>
</html>

</html>
