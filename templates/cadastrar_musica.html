<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Nova Música</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='playlists.css') }}">
</head>
<body>

    <!-- Link para voltar à lista de músicas -->
    <a href="{{ url_for('musico_listar_musicas', musico_id=musico_id) }}" class="link-voltar">← Voltar à Lista de Músicas</a>

    <div class="form-container">
        <h1>Cadastrar Nova Música</h1>

        {% if erro %}
            <p style="color: #ff5252; margin-bottom: 15px;">{{ erro }}</p>
        {% endif %}

        <form method="POST">
            <div class="form-group">
                <label>Título da Música:</label>
                <input type="text" name="titulo" required>
            </div>

            <div class="form-group">
                <label>Duração (ex: 03:45):</label>
                <input type="text" name="duracao" required>
            </div>

            <div class="form-group">
                <label>Álbum (Opcional):</label>
                <select name="id_album">
                    <option value="">-- Single (Sem Álbum) --</option>
                    {% for album in albuns %}
                        <option value="{{ album.id_album }}">{{ album.nome_album }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label>Gênero:</label>
                <select name="id_genero" required>
                    <option value="">Selecione um gênero</option>
                    {% for genero in generos %}
                        <option value="{{ genero.id_genero }}">{{ genero.nome_genero }}</option>
                    {% endfor %}
                </select>
            </div>

            <button type="submit" class="btn-submit">Guardar Música</button>
        </form>
    </div>

</body>
</html>
