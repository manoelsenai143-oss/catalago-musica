
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Moderação de Músicas</title>

    <!-- Materialize CSS -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">

    <!-- Material Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

    <!-- DataTables CSS -->
    <link rel="stylesheet"
          href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">

    <!-- CSS personalizado -->
    <link rel="stylesheet"
          href="{{ url_for('static', filename='admin_musica.css') }}">
</head>

<body>

    <div class="container-painel">

        <!-- Cabeçalho -->
        <div class="cabecalho">
            <h4>
                <i class="material-icons">library_music</i>
                Moderação Global de Músicas
            </h4>

            <a href="{{ url_for('exportar_musicas_geral_pdf') }}"
               class="btn-exportar">
                <i class="material-icons left">picture_as_pdf</i>
                Exportar PDF
            </a>
        </div>

        <!-- Tabela de músicas -->
        <div class="tabela-container">

            <table id="tabelaMusicasAdmin" class="highlight responsive-table">

                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Título</th>
                        <th>Artista</th>
                        <th>Álbum</th>
                        <th>Gênero</th>
                        <th>Duração</th>
                        <th class="coluna-acoes">Ações</th>
                    </tr>
                </thead>

                <tbody>
                    {% for m in musicas %}
                    <tr>
                        <td>{{ m.id }}</td>
                        <td>{{ m.titulo }}</td>
                        <td>{{ m.artista }}</td>
                        <td>{{ m.album }}</td>
                        <td>{{ m.genero }}</td>
                        <td>{{ m.duracao }}</td>

                        <td class="coluna-acoes">
                            <form
                                action="{{ url_for('admin_excluir_musica_global', musica_id=m.id) }}"
                                method="POST"
                                onsubmit="return confirm('Tem certeza que deseja remover esta música da plataforma?');">

                                <button type="submit" class="btn-excluir">
                                    <i class="material-icons">delete</i>
                                    Excluir
                                </button>

                            </form>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>

            </table>

        </div>

        <!-- Voltar -->
        <a href="{{ url_for('admin_home') }}" class="btn-voltar">
            <i class="material-icons left">arrow_back</i>
            Voltar ao Painel Admin
        </a>

    </div>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>

    <!-- Materialize JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>

    <!-- DataTables JS -->
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>

    <!-- Configuração DataTables -->
    <script>
        $(document).ready(function () {
            $('#tabelaMusicasAdmin').DataTable({
                language: {
                    url: "//cdn.datatables.net/plug-ins/1.13.6/i18n/pt-BR.json"
                },
                pageLength: 10,
                ordering: true,
                responsive: true,
                columnDefs: [
                    {
                        orderable: false,
                        targets: 6
                    }
                ]
            });
        });
    </script>

</body>
</html>
