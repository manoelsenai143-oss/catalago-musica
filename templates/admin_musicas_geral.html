<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Moderação de Músicas</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body style="background-color: #121212; color: #fff; font-family: Arial, sans-serif; padding: 40px;">
    <div style="max-width: 950px; margin: auto; background: #181818; padding: 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.5);">
        <h2 style="color: #3498db; margin-bottom: 20px;">🎵 Moderação Global de Músicas</h2>

        <table style="width: 100%; border-collapse: collapse; margin-bottom: 20px;">
            <thead>
                <tr style="background: #282828; text-align: left;">
                    <th style="padding: 10px;">ID</th>
                    <th style="padding: 10px;">Título</th>
                    <th style="padding: 10px;">Artista</th>
                    <th style="padding: 10px;">Álbum</th>
                    <th style="padding: 10px;">Género</th>
                    <th style="padding: 10px;">Duração</th>
                    <th style="padding: 10px; text-align: center;">Ações</th>
                </tr>
            </thead>
            <tbody>
                {% for m in musicas %}
                <tr style="border-bottom: 1px solid #333;">
                    <td style="padding: 10px;">{{ m.id }}</td>
                    <td style="padding: 10px;">{{ m.titulo }}</td>
                    <td style="padding: 10px;">{{ m.artista }}</td>
                    <td style="padding: 10px;">{{ m.album }}</td>
                    <td style="padding: 10px;">{{ m.genero }}</td>
                    <td style="padding: 10px;">{{ m.duracao }}</td>
                    <td style="padding: 10px; text-align: center;">
                        <form action="{{ url_for('admin_excluir_musica_global', musica_id=m.id) }}" method="POST" style="display:inline;">
                            <button type="submit" onclick="return confirm('Tem certeza que deseja remover esta música da plataforma?');" style="background: #e74c3c; color: #fff; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer;">Excluir</button>
                        </form>
                    </td>
                </tr>
                {% else %}
                <tr>
                    <td colspan="7" style="padding: 15px; text-align: center; color: #b3b3b3;">Nenhuma música registada na plataforma.</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>

        <a href="{{ url_for('admin_home') }}" style="color: #b3b3b3; text-decoration: none;">← Voltar ao Painel Admin</a>
    </div>
</body>
</html>
