<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Login - Catálogo de Música</title>
</head>
<body>
    <h2>Fazer Login</h2>

    <!-- Se houver erro de login, mostra a mensagem na tela -->
    {% if erro %}
        <p style="color: red;">{{ erro }}</p>
    {% endif %}

    <form action="/login" method="POST">
        <label>Email:</label><br>
        <input type="email" name="email" required><br><br>

        <label>Senha:</label><br>
        <input type="password" name="senha" required><br><br>

        <button type="submit">Entrar</button>
    </form>
    <br>
    <a href="/usuarios">Não tem conta? Registe-se</a>
</body>
</html>
