<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Lista de Músicas</title>
    <style>
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ccc; padding: 10px; text-align: left; }
        th { background-color: #f4f4f4; }
    </style>
</head>
<body>
    <h2>Catálogo de Músicas</h2>

    <table>
        <tr>
            <th>ID</th>
            <th>Título</th>
            <th>Duração</th>
            <th>Artista</th>
            <th>Álbum</th>
            <th>Gênero</th>
        </tr>
        <!-- O Jinja percorre a lista 'musicas' enviada pelo app.py -->
        {% for musica in musicas %}
        <tr>
            <td>{{ musica.id }}</td>
            <td>{{ musica.titulo }}</td>
            <td>{{ musica.duracao }}</td>
            <td>{{ musica.artista }}</td>
            <td>{{ musica.album }}</td>
            <td>{{ musica.genero }}</td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
