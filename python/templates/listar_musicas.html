<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Lista de Músicas</title>
</head>
<body>
    <h2>Catálogo de Músicas</h2>

    <table>
        <tr>
            <th>ID</th>
            <th>Título</th>
            <th>Duração</th>
            <th>Álbum</th>
            <th>Gênero</th>
        </tr>
        {% for musica in musicas %}
        <tr>
            <td>{{ musica.id }}</td>
            <td>{{ musica.titulo }}</td>
            <td>{{ musica.duracao }}</td>
            <!-- Se tiver álbum, mostra o nome. Se vier vazio (None), mostra 'Single' -->
            <td>{{ musica.album if musica.album else 'Single (Sem Álbum)' }}</td>
            <td>{{ musica.genero }}</td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
