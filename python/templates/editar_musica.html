<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Editar Música</title>
</head>
<body>
    <h2>Editar Música</h2>
    <form action="/musicas/editar/{{ musica.id_musica }}" method="POST">
        <label>Título:</label><br>
        <input type="text" name="titulo" value="{{ musica.titulo }}" required><br><br>

        <label>Duração (segundos):</label><br>
        <input type="number" name="duracao" value="{{ musica['duração'] }}" required><br><br>

        <button type="submit">Salvar Alterações</button>
    </form>
    <br>
    <a href="/musicas">Cancelar</a>
</body>
</html>
