<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cadastrar Música - Painel do Músico</title>
</head>
<body style="background-color: #121212; color: #fff; margin: 0; font-family: sans-serif; display: flex; height: 100vh; overflow: hidden;">

    <!-- BARRA LATERAL (SIDEBAR) -->
    <div style="width: 240px; background-color: #000; display: flex; flex-direction: column; justify-content: space-between; padding: 20px; border-right: 1px solid #222;">
        <div>
            <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 30px; color: #1db954; font-weight: bold; font-size: 1.2rem;">
                🎵 Sistema
            </div>

            <nav style="display: flex; flex-direction: column; gap: 15px;">
                <a href="{{ url_for('musico_home', musico_id=musico_id) }}" style="color: #b3b3b3; text-decoration: none; font-weight: bold; display: flex; align-items: center; gap: 10px;">
                    🏠 Início
                </a>
                <a href="{{ url_for('musico_listar_musicas', musico_id=musico_id) }}" style="color: #b3b3b3; text-decoration: none; font-weight: bold; display: flex; align-items: center; gap: 10px;">
                    🎶 Músicas
                </a>
                <a href="{{ url_for('musico_listar_albuns', musico_id=musico_id) }}" style="color: #b3b3b3; text-decoration: none; font-weight: bold; display: flex; align-items: center; gap: 10px;">
                    💿 Álbuns
                </a>
                <a href="{{ url_for('musico_cadastrar_musica', musico_id=musico_id) }}" style="color: #fff; text-decoration: none; font-weight: bold; display: flex; align-items: center; gap: 10px;">
                    ➕ Cadastrar Música
                </a>
            </nav>
        </div>

        <div>
            <a href="{{ url_for('logout') }}" style="color: #e74c3c; text-decoration: none; font-size: 0.9rem; font-weight: bold; display: flex; align-items: center; gap: 8px;">
                🚪 Terminar Sessão
            </a>
        </div>
    </div>

    <!-- CONTEÚDO PRINCIPAL -->
    <div style="flex: 1; padding: 40px; overflow-y: auto; background-color: #121212; display: flex; justify-content: center; align-items: center;">

        <div style="background-color: #181818; padding: 30px; border-radius: 8px; width: 420px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); border: 1px solid #282828;">

            <h2 style="margin-top: 0; color: #1db954; font-size: 1.5rem; margin-bottom: 20px;">🎶 Cadastrar Nova Música</h2>

            <form action="{{ url_for('musico_cadastrar_musica', musico_id=musico_id) }}" method="POST" style="display: flex; flex-direction: column; gap: 15px;">

                <div>
                    <label style="display: block; margin-bottom: 5px; color: #b3b3b3; font-size: 0.9rem;">Título da Música:</label>
                    <input type="text" name="titulo" required style="width: 100%; padding: 10px; border-radius: 4px; border: 1px solid #333; background: #222; color: #fff; box-sizing: border-box;">
                </div>

                <div>
                    <label style="display: block; margin-bottom: 5px; color: #b3b3b3; font-size: 0.9rem;">Duração (ex: 03:45):</label>
                    <input type="text" name="duracao" required style="width: 100%; padding: 10px; border-radius: 4px; border: 1px solid #333; background: #222; color: #fff; box-sizing: border-box;">
                </div>

                <!-- Campo de texto livre para o Nome do Artista -->
                <div>
                    <label style="display: block; margin-bottom: 5px; color: #b3b3b3; font-size: 0.9rem;">Nome do Artista:</label>
                    <input type="text" name="nome_artista" required placeholder="Digite o nome do artista" style="width: 100%; padding: 10px; border-radius: 4px; border: 1px solid #333; background: #222; color: #fff; box-sizing: border-box;">
                </div>

                <div>
                    <label style="display: block; margin-bottom: 5px; color: #b3b3b3; font-size: 0.9rem;">Álbum (Opcional):</label>
                    <select name="id_album" style="width: 100%; padding: 10px; border-radius: 4px; border: 1px solid #333; background: #222; color: #fff; box-sizing: border-box;">
                        <option value="">-- Single (Sem Álbum) --</option>
                        {% for album in albuns %}
                            <option value="{{ album.id_album }}">{{ album.nome_album }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div>
                    <label style="display: block; margin-bottom: 5px; color: #b3b3b3; font-size: 0.9rem;">Gênero:</label>
                    <select name="id_genero" required style="width: 100%; padding: 10px; border-radius: 4px; border: 1px solid #333; background: #222; color: #fff; box-sizing: border-box;">
                        <option value="">Selecione um gênero</option>
                        {% for genero in generos %}
                            <option value="{{ genero.id_genero }}">{{ genero.nome_genero }}</option>
                        {% endfor %}
                    </select>
                </div>

                <button type="submit" style="padding: 12px; background-color: #1db954; color: #fff; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 1rem; margin-top: 10px;">
                    Guardar Música
                </button>
            </form>

            <div style="margin-top: 20px; text-align: center;">
                <a href="{{ url_for('musico_listar_musicas', musico_id=musico_id) }}" style="color: #b3b3b3; text-decoration: none; font-size: 0.9rem;">← Voltar à Lista de Músicas</a>
            </div>

        </div>

    </div>

</body>
</html>
