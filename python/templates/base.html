<!DOCTYPE html>
<html lang="pt-BR">
<head>

    <title>Catálogo Musical - Tudo Junto</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <!-- BARRA LATERAL (MENU) -->
    <aside class="sidebar">
        <h2>Library</h2>
        <nav>
            <a href="/">🏠 Inicio</a>

        <div style="display: flex; gap: 15px; margin: 20px 0;">
            <div style="background-color: #1e1e24; padding: 15px; border-radius: 10px; width: 150px; text-align: center;">
                <div style="width: 80px; height: 80px; background-color: #333; border-radius: 50%; margin: 0 auto 10px auto;"></div>
                <strong>Para estudar</strong>
            </div>
            <div style="background-color: #1e1e24; padding: 15px; border-radius: 10px; width: 150px; text-align: center;">
