<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cadastrar Álbum</title>
</head>
<body style="background-color: #121212; color: #fff; margin: 0; font-family: sans-serif; display: flex; height: 100vh; justify-content: center; align-items: center;">

    <div style="background-color: #181818; padding: 30px; border-radius: 8px; width: 400px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); border: 1px solid #282828;">
        
        <h2 style="margin-top: 0; color: #1db954; font-size: 1.5rem; margin-bottom: 20px;">💿 Novo Álbum</h2>

        <form action="{{ url_for('musico_cadastrar_album', musico_id=musico_id) }}" method="POST" style="display: flex; flex-direction: column; gap: 15px;">
            
            <div>
                <label style="display: block; margin-bottom: 5px; color: #b3b3b3; font-size: 0.9rem;">Nome do Álbum:</label>
                <input type="text" name="nome_album" required style="width: 100%; padding: 10px; border-radius: 4px; border: 1px solid #333; background: #222; color: #fff; box-sizing: border-box;">
            </div>

            <div>
                <label style="display: block; margin-bottom: 5px; color: #b3b3b3; font-size: 0.9rem;">Ano do Álbum:</label>
                <input type="number" name="ano_album" required style="width: 100%; padding: 10px; border-radius: 4px; border: 1px solid #333; background: #222; color: #fff; box-sizing: border-box;">
            </div>

            <button type="submit" style="padding: 12px; background-color: #1db954; color: #fff; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 1rem; margin-top: 10px;">
                Criar Álbum
            </button>
        </form>

        <div style="margin-top: 20px; text-align: center;">
            <a href="{{ url_for('musico_home', musico_id=musico_id) }}" style="color: #b3b3b3; text-decoration: none; font-size: 0.9rem;">← Voltar ao Início</a>
        </div>

    </div>

</body>
</html>
